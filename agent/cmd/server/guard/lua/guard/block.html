<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{status}}</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border-radius:12px;padding:40px 48px;max-width:520px;width:calc(100% - 32px);box-sizing:border-box;box-shadow:0 4px 24px rgba(0,0,0,.06)}
h1{font-size:56px;margin:0;color:#e5484d}
p{font-size:16px;line-height:1.6;margin:12px 0 24px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;color:#646a73;margin:0}
dd{margin:0;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){body{background:#17181a;color:#e8e9eb}.box{background:#222326;box-shadow:none}dl{color:#9ea3ab}}
</style>
</head>
<body>
<div class="box">
<h1>{{status}}</h1>
<p>{{reason}}</p>
<dl>
<dt>IP</dt><dd>{{ip}}</dd>
<dt>Event ID</dt><dd>{{event_id}}</dd>
<dt>Time</dt><dd>{{time}}</dd>
</dl>
</div>
</body>
</html>
